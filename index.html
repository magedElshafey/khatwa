<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1721">
<meta name="description" content="خطوة — موقع عربي لتنظيم التعلم والعادات والتقدم، يعمل بدون إنترنت.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>
  // Apply the saved choice before painting. Dark is the first-visit default.
  try {
    const pref=localStorage.getItem('khotwa-theme');
    const theme=pref==='light'?'light':'dark';
    document.documentElement.dataset.theme=theme;
    document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#0d1721':'#f5f7f8';
  } catch (_) { document.documentElement.dataset.theme='dark'; }
</script>
<link rel="stylesheet" href="./styles.css">
<title>خطوة | نظام حياتي</title>
</head>
<body>
<div id="app"><div class="startup">بنجهّز مساحتك…</div></div>
<noscript>الموقع محتاج JavaScript عشان يشتغل.</noscript>
<script defer src="./roadmap-data.js"></script>
<script defer src="./app.js"></script>
</body>
</html>
